<style>
  :root{
    --cream:#f3e9d2;
    --red:#b23a2e;
    --red-dark:#8a2a20;
    --green:#4fae5a;
    --tan-1:#e9dcbb;
    --tan-2:#d8c69a;
    --wood:#6b4a2c;
    --wood-dark:#3c281a;
    --ink:#181009;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Manrope',sans-serif; color:var(--cream);
    overflow:hidden; -webkit-tap-highlight-color:transparent;
  }
  main{
    position:relative; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    overflow:hidden;
    padding:
      max(0.9rem, env(safe-area-inset-top))
      max(0.9rem, env(safe-area-inset-right))
      max(0.6rem, env(safe-area-inset-bottom))
      max(0.9rem, env(safe-area-inset-left));
  }

  .hero-bg{
    position:fixed; inset:0; z-index:-30;
    background-image: var(--bg-image);
    background-size:cover; background-position:center;
    background-color:#2a2016;
  }
  .vignette{
    position:fixed; inset:0; z-index:-10; pointer-events:none;
    background:
      linear-gradient(180deg, rgba(8,5,3,0.35) 0%, transparent 22%, transparent 78%, rgba(8,5,3,0.5) 100%),
      radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(8,5,3,0.35) 100%);
  }
  /* ---------------- cassette-deck player ---------------- */
  .player-wrap{ width:100%; max-width:640px; position:relative; z-index:20; }
  .deck{
    background:linear-gradient(180deg, var(--tan-1), var(--tan-2));
    border:3px solid var(--wood);
    border-radius:22px;
    padding:14px 16px 14px;
    box-shadow:0 20px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .deck-top{ display:flex; flex-direction:column; gap:12px; }
  .art{
    position:relative; width:100%; aspect-ratio:398/150; border-radius:12px; overflow:hidden;
    background:#0c0a08; border:2px solid var(--wood);
    box-shadow:0 4px 14px rgba(0,0,0,0.45);
  }
  .art iframe, .art .art-fallback{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .art-fallback{
    display:flex; align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(circle at 35% 30%, #3a2a20, #140f0b 70%);
    font-family:'Manrope',sans-serif; color:#d9a441; font-size:16px; padding:4px;
  }
  .deck-meta{ min-width:0; }
  .deck-meta .title{
    font-family:'Caveat',cursive; font-weight:700; font-size:1.5rem; color:var(--wood-dark);
    line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .deck-meta .sub{
    font-family:'Caveat',cursive; font-weight:600; font-size:1.05rem; color:#7a6448;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ruler / scrubber */
  .ruler{
    margin-top:10px; background:var(--ink); border-radius:10px; padding:8px 12px 6px;
    position:relative;
  }
  .ruler-ticks{
    display:flex; justify-content:space-between; font-size:10px; color:rgba(243,233,210,0.55);
    font-variant-numeric:tabular-nums; margin-bottom:4px; pointer-events:none;
  }
  .seek{
    position:relative; height:22px; display:flex; align-items:center; cursor:pointer; touch-action:none;
  }
  .seek .rail{
    position:absolute; left:0; right:0; height:14px; border-radius:4px;
    background:repeating-linear-gradient(90deg, rgba(243,233,210,0.12) 0 1px, transparent 1px 8px);
  }
  .seek .fill{ position:absolute; left:0; top:4px; height:6px; border-radius:3px; background:linear-gradient(90deg,var(--green),#3f8f49); width:0%; }
  .seek .knob{
    position:absolute; top:-3px; width:3px; height:22px; background:var(--green); left:0%;
    transform:translateX(-50%); box-shadow:0 0 8px rgba(79,174,90,0.9);
  }
  .ruler-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
  .tabs-tape{ display:flex; gap:5px; }
  .tab-tape{
    width:22px; height:19px; border-radius:4px; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:rgba(243,233,210,0.6); background:rgba(243,233,210,0.08);
    cursor:pointer; user-select:none;
  }
  .tab-tape.active{ background:var(--green); color:var(--ink); }
  .counter{
    font-family:'Manrope',sans-serif; font-size:10.5px; letter-spacing:0.06em; color:rgba(243,233,210,0.55);
    font-variant-numeric:tabular-nums;
  }
  .times{
    font-family:'Manrope',sans-serif; font-size:10.5px; color:rgba(243,233,210,0.7); font-variant-numeric:tabular-nums;
  }

  /* transport row */
  .transport-row{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
  .transport{ display:flex; align-items:center; gap:8px; }
  .tbtn{
    width:44px; height:36px; border-radius:8px; border:1px solid var(--wood);
    background:linear-gradient(180deg,#f6ecd4,#e0cfa2);
    color:var(--wood-dark); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 var(--wood), 0 5px 10px rgba(0,0,0,0.3);
  }
  .tbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--wood); }
  .tbtn.play{ width:50px; background:linear-gradient(180deg,#f6ecd4,#e0cfa2); }
  .tbtn svg{ width:15px; height:15px; }
  .wordmark{
    display:flex; align-items:center; gap:6px; font-family:'Baloo 2',sans-serif; font-weight:700;
    font-size:0.85rem; letter-spacing:0.08em; color:var(--wood-dark); opacity:0.85;
  }
  .wordmark .bar{ width:5px; height:16px; border-radius:2px; background:var(--wood-dark); }

  footer.note{
    max-width:640px; text-align:center; font-size:10.5px; color:rgba(243,233,210,0.55);
    line-height:1.5; margin-top:0.55rem; position:relative; z-index:20;
  }

  @media (max-width:420px){
    .deck-meta .title{font-size:1.3rem;}
  }

</style>
</head>
<body>
<main>
  <div class="hero-bg" id="heroBg"></div>
  <div class="vignette"></div>

  <div class="player-wrap">
    <div class="deck">
      <div class="deck-top">
        <div class="art" id="art">
          <div class="art-fallback">add a<br/>videoId</div>
        </div>
        <div class="deck-meta">
          <div class="title" id="track-title">—</div>
          <div class="sub" id="track-sub">—</div>
        </div>
      </div>

      <div class="ruler">
        <div class="ruler-ticks" id="ruler-ticks"><span>0</span><span>1</span><span>2</span><span>3</span></div>
        <div class="seek" id="seek">
          <div class="rail"></div><div class="fill"></div><div class="knob"></div>
        </div>
        <div class="ruler-foot">
          <div class="tabs-tape" id="tabs-tape"></div>
          <div class="counter" id="counter">0000</div>
          <div class="times"><span id="elapsed">0:00</span> / <span id="duration">0:00</span></div>
        </div>
      </div>

      <div class="transport-row">
        <div class="transport">
          <button class="tbtn" id="prev" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12l-9-6z"/></svg>
          </button>
          <button class="tbtn play" id="play" aria-label="Play">
            <svg viewBox="0 0 24 24" fill="currentColor" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="tbtn" id="next" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6v12l9-6z"/></svg>
          </button>
        </div>
        <div class="wordmark"><span class="bar"></span>TAAL DECK</div>
      </div>
    </div>

    <footer class="note"></footer>
  </div>
</main>

<script>
/* =========================================================================
   PLAYLISTS — replace videoId: null once you've confirmed you have the right
   to use the track (your own upload, or an official upload with embedding
   enabled). Each playlist becomes a lettered tape tab (A, B, C…) on the deck.
   ========================================================================= */
const PLAYLISTS = {
  "सुनहरे दिन": [
    { id:"g1", title:"Track title", artist:"", film:"", year:"", videoId:"YVPmcLK7I5M" },
    { id:"g2", title:"Track title", artist:"", film:"", year:"", videoId:"PsGZ2ZchYhI" },
    { id:"g3", title:"Track title", artist:"", film:"", year:"", videoId:"9zsiNkBlhQI" },
    { id:"g4", title:"Track title", artist:"", film:"", year:"", videoId:"d-0u7ksTA0k" },
    { id:"g5", title:"Track title", artist:"", film:"", year:"", videoId:"bA1Lh-QSSYU" },
  ],
  "रातों की महफ़िल": [
    { id:"n1", title:"Track title", artist:"Artist", film:"Film", year:"", videoId:null },
    { id:"n2", title:"Track title", artist:"Artist", film:"Film", year:"", videoId:null },
  ],
  "जैन स्तवन": [
    { id:"j1", title:"Wahla Aadinath", artist:"Bharti Gada", film:"Jain Stavan", year:"", src:"audio/wahla-aadinath.mp3" },
    { id:"j2", title:"Siddhachal Darbar Jajarmaan Laage Che", artist:"Piyush Shah, Manan Sanghvi, Jainam Mehta", film:"Giriraj Song", year:"", src:"audio/siddhachal-darbar.mp3" },
    { id:"j3", title:"Mitha Adinath (Mithipaldi)", artist:"Pu Acharya Udayratna Suriji M.S.", film:"25 Salgiri Mahotsav", year:"", src:"audio/mitha-adinath.mp3" },
  ],
};
const PLAYLIST_NAMES = Object.keys(PLAYLISTS);
const LETTERS = "ABCDEFGH";

let currentPlaylistName = PLAYLIST_NAMES[0];
let currentIndex = 0;
let ytPlayer = null, ytReady = false, isPlaying = false, seekDragging = false, progressTimer = null;
let backend = 'yt'; // 'yt' | 'yt-playlist' | 'html5'
const htmlAudio = new Audio();
htmlAudio.preload = 'metadata';

// Persistent containers so the YouTube iframe is NEVER removed/re-added to the DOM
// (removing and re-appending an iframe forces the browser to reload it, which
// breaks the YouTube player's internal state and causes "stuck on same video" bugs).
const ytHost = document.createElement('div');
ytHost.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:none;';
const fallbackDiv = document.createElement('div');
fallbackDiv.className = 'art-fallback';
fallbackDiv.style.display = 'none';

const els = {
  art: document.getElementById('art'),
  trackTitle: document.getElementById('track-title'),
  trackSub: document.getElementById('track-sub'),
  rulerTicks: document.getElementById('ruler-ticks'),
  seek: document.getElementById('seek'),
  tabsTape: document.getElementById('tabs-tape'),
  counter: document.getElementById('counter'),
  elapsed: document.getElementById('elapsed'),
  duration: document.getElementById('duration'),
  play: document.getElementById('play'),
  playIcon: document.getElementById('play-icon'),
  prev: document.getElementById('prev'),
  next: document.getElementById('next'),
};
els.art.appendChild(ytHost);
els.art.appendChild(fallbackDiv);

function showYTHost(){ ytHost.style.display = 'block'; fallbackDiv.style.display = 'none'; }
function showFallback(html){ fallbackDiv.innerHTML = html; fallbackDiv.style.display = 'flex'; ytHost.style.display = 'none'; }

/* ---------------- tape tabs (playlists) ---------------- */
function renderTapeTabs(){
  els.tabsTape.innerHTML = '';
  PLAYLIST_NAMES.forEach((name, i)=>{
    const el = document.createElement('div');
    el.className = 'tab-tape' + (name===currentPlaylistName ? ' active':'');
    el.textContent = LETTERS[i];
    el.title = name;
    el.addEventListener('click', ()=>{
      currentPlaylistName = name; currentIndex = 0;
      renderTapeTabs(); loadTrack(currentIndex, false);
    });
    els.tabsTape.appendChild(el);
  });
}

function currentTrack(){ return PLAYLISTS[currentPlaylistName][currentIndex]; }
function renderMeta(){
  const t = currentTrack();
  els.trackTitle.textContent = t.title;
  els.trackSub.textContent = [t.artist, t.year].filter(Boolean).join(' · ');
}

/* ---------------- YouTube IFrame API ---------------- */
function loadYouTubeAPI(){
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}
window.onYouTubeIframeAPIReady = function(){ ytReady = true; loadTrack(currentIndex, false); };

function loadTrack(index, autoplay){
  currentIndex = index;
  const t = currentTrack();
  renderMeta();
  resetSeek();
  isPlaying = false; updatePlayIcon();

  // pause whichever backend was previously active
  htmlAudio.pause();
  if(ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
  if(progressTimer) clearInterval(progressTimer);

  if(t.src){
    backend = 'html5';
    showFallback('🎵');
    htmlAudio.src = t.src;
    htmlAudio.currentTime = 0;
    htmlAudio.load();
    if(autoplay) htmlAudio.play().catch(()=>{});
    startProgressLoop();
    return;
  }

  if(t.playlistId){
    backend = 'yt-playlist';
    if(!ytReady) return;
    showYTHost();
    if(!ytPlayer){
      ytPlayer = new YT.Player(ytHost, {
        width:'100%', height:'100%',
        playerVars:{ listType:'playlist', list:t.playlistId, autoplay:autoplay?1:0, controls:0, modestbranding:1, rel:0, playsinline:1 },
        events:{
          onReady:()=>{ if(autoplay) ytPlayer.playVideo(); startProgressLoop(); updateDurationLabel(); updatePlaylistMeta(); },
          onStateChange:onPlayerStateChange,
          onError:onPlayerError,
        }
      });
    } else {
      ytPlayer.loadPlaylist({ list:t.playlistId, listType:'playlist' });
      if(!autoplay) ytPlayer.pauseVideo();
    }
    return;
  }

  if(!t.videoId){
    showFallback('add a<br/>videoId');
    return;
  }
  backend = 'yt';
  if(!ytReady) return;
  showYTHost();

  if(!ytPlayer){
    ytPlayer = new YT.Player(ytHost, {
      width:'100%', height:'100%', videoId:t.videoId,
      playerVars:{ autoplay:autoplay?1:0, controls:0, modestbranding:1, rel:0, playsinline:1 },
      events:{
        onReady:()=>{ if(autoplay) ytPlayer.playVideo(); startProgressLoop(); updateDurationLabel(); },
        onStateChange:onPlayerStateChange,
        onError:onPlayerError,
      }
    });
  } else {
    ytPlayer.loadVideoById(t.videoId);
    if(!autoplay) ytPlayer.pauseVideo();
  }
}

/* ---------------- HTML5 audio events ---------------- */
htmlAudio.addEventListener('play', ()=>{ isPlaying = true; updatePlayIcon(); });
htmlAudio.addEventListener('pause', ()=>{ isPlaying = false; updatePlayIcon(); });
htmlAudio.addEventListener('ended', ()=>{ nextTrack(true); });
htmlAudio.addEventListener('loadedmetadata', ()=>{ if(backend==='html5') updateDurationLabel(); });
htmlAudio.addEventListener('error', ()=>{ if(backend==='html5'){ console.warn('Audio playback error'); } });

function onPlayerStateChange(e){
  if(e.data === YT.PlayerState.PLAYING){ isPlaying = true; updateDurationLabel(); if(backend==='yt-playlist') updatePlaylistMeta(); }
  else if(e.data === YT.PlayerState.PAUSED){ isPlaying = false; }
  else if(e.data === YT.PlayerState.ENDED){ if(backend!=='yt-playlist') nextTrack(true); }
  updatePlayIcon();
}
function updatePlaylistMeta(){
  if(!ytPlayer || !ytPlayer.getVideoData) return;
  const data = ytPlayer.getVideoData();
  if(data && data.title){
    els.trackTitle.textContent = data.title;
    els.trackSub.textContent = data.author || 'YouTube Playlist';
  }
}
function onPlayerError(e){ console.warn('YouTube playback error', e.data); nextTrack(true); }

function updatePlayIcon(){
  els.playIcon.innerHTML = isPlaying
    ? '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>'
    : '<path d="M8 5v14l11-7z"/>';
}
function togglePlay(){
  const t = currentTrack();
  if(backend==='html5' && t.src){
    if(isPlaying) htmlAudio.pause(); else htmlAudio.play().catch(()=>{});
    return;
  }
  if(!ytPlayer || (!t.videoId && !t.playlistId)) return;
  if(isPlaying) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
}
function nextTrack(auto){
  if(backend==='yt-playlist' && ytPlayer && ytPlayer.nextVideo){ ytPlayer.nextVideo(); return; }
  const list = PLAYLISTS[currentPlaylistName];
  loadTrack((currentIndex+1)%list.length, auto || isPlaying);
}
function prevTrack(){
  if(backend==='yt-playlist' && ytPlayer && ytPlayer.previousVideo){ ytPlayer.previousVideo(); return; }
  const list = PLAYLISTS[currentPlaylistName];
  loadTrack((currentIndex-1+list.length)%list.length, isPlaying);
}
els.play.addEventListener('click', togglePlay);
els.next.addEventListener('click', ()=>nextTrack(isPlaying));
els.prev.addEventListener('click', prevTrack);

/* ---------------- seek / ruler / counter ---------------- */
function fmtTime(sec){
  if(!isFinite(sec)||sec<0) sec=0;
  const m = Math.floor(sec/60), s = Math.floor(sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}
function resetSeek(){
  els.elapsed.textContent='0:00'; els.duration.textContent='0:00';
  els.counter.textContent='0000';
  setSeekFill(0);
  els.rulerTicks.innerHTML = '<span>0</span><span>1</span><span>2</span><span>3</span>';
}
function setSeekFill(pct){
  els.seek.querySelector('.fill').style.width = pct+'%';
  els.seek.querySelector('.knob').style.left = pct+'%';
}
function updateDurationLabel(){
  const dur = backend==='html5' ? (htmlAudio.duration||0) : (ytPlayer && ytPlayer.getDuration ? ytPlayer.getDuration() : 0);
  els.duration.textContent = fmtTime(dur);
  const mins = Math.max(1, Math.ceil(dur/60));
  els.rulerTicks.innerHTML = Array.from({length:mins+1}, (_,i)=>`<span>${i}</span>`).join('');
}
function startProgressLoop(){
  if(progressTimer) clearInterval(progressTimer);
  progressTimer = setInterval(()=>{
    if(seekDragging) return;
    let dur, cur;
    if(backend==='html5'){
      dur = htmlAudio.duration || 0; cur = htmlAudio.currentTime || 0;
    } else {
      if(!ytPlayer) return;
      dur = ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
      cur = ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0;
    }
    if(dur>0) setSeekFill((cur/dur)*100);
    els.elapsed.textContent = fmtTime(cur);
    els.counter.textContent = String(Math.floor(cur*4)).padStart(4,'0');
  }, 500);
}
function attachSeekHandlers(seekEl){
  function pctFromEvent(evt){
    const rect = seekEl.getBoundingClientRect();
    const x = (evt.clientX ?? (evt.touches && evt.touches[0].clientX)) - rect.left;
    return Math.min(100, Math.max(0, (x/rect.width)*100));
  }
  seekEl.addEventListener('pointerdown', (evt)=>{
    const t = currentTrack();
    if(backend==='html5' && !t.src) return;
    if((backend==='yt'||backend==='yt-playlist') && (!ytPlayer || (!t.videoId && !t.playlistId))) return;
    seekDragging = true; seekEl.setPointerCapture(evt.pointerId);
    setSeekFill(pctFromEvent(evt));
  });
  seekEl.addEventListener('pointermove', (evt)=>{ if(seekDragging) setSeekFill(pctFromEvent(evt)); });
  seekEl.addEventListener('pointerup', (evt)=>{
    if(!seekDragging) return;
    seekDragging = false;
    const pct = pctFromEvent(evt);
    if(backend==='html5'){
      const dur = htmlAudio.duration || 0;
      if(dur>0) htmlAudio.currentTime = (pct/100)*dur;
    } else if(ytPlayer){
      const dur = ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
      if(dur>0) ytPlayer.seekTo((pct/100)*dur, true);
    }
  });
}
attachSeekHandlers(els.seek);

/* ---------------- boot ---------------- */
renderTapeTabs();
renderMeta();
loadYouTubeAPI();
</script>
</body>
</html>
